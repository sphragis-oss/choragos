version: 2
project_name: choragos

before:
  hooks:
    - go mod tidy
    - ./scripts/gen-cli-assets.sh

builds:
  - id: choragos
    main: ./cmd/choragos
    binary: choragos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive

# keyless (OIDC) cosign signing; needs cosign on PATH and id-token: write in CI.
# cosign v2+ emits a single bundle (signature + certificate); verify with --bundle.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# brews: is hard-deprecated (goreleaser.com/deprecations#brews); casks are the house pattern
homebrew_casks:
  - name: choragos
    binaries:
      - choragos
    repository:
      owner: sphragis-oss
      name: homebrew-sphragis
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sphragis-oss/choragos
    description: "Secure multi-agent development orchestrator TUI"
    completions:
      bash: completions/choragos.bash
      zsh: completions/_choragos
      fish: completions/choragos.fish
    # cask manpage stanzas take literal paths; regenerate this list when subcommands change
    manpages:
      - manpages/choragos-attach.1
      - manpages/choragos-checkpoints-prune.1
      - manpages/choragos-checkpoints.1
      - manpages/choragos-delegate.1
      - manpages/choragos-doctor.1
      - manpages/choragos-init.1
      - manpages/choragos-kill.1
      - manpages/choragos-ls.1
      - manpages/choragos-reload.1
      - manpages/choragos-report.1
      - manpages/choragos-rollback.1
      - manpages/choragos-roster-add.1
      - manpages/choragos-roster.1
      - manpages/choragos-serve.1
      - manpages/choragos-version.1
      - manpages/choragos-work-done.1
      - manpages/choragos.1
    # unsigned binaries: strip the quarantine bit or macOS reports the app as damaged
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/choragos"]
          end

release:
  github:
    owner: sphragis-oss
    name: choragos
